<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>근정전 · 브릭 모션 01</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
  }
}
</script>
<style>
  :root{
    --bg:#F2EEE6;
    --ink:#191713;
    --muted:#8B8275;
    --faint:#B6AC9C;
    --line:rgba(25,23,19,.13);
    --panel:rgba(252,249,242,.92);
    --accent:#E8612C;
    --blue:#2F5BE8;
    --mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  #stage{position:fixed;inset:0;z-index:0}
  #stage canvas{display:block;width:100%;height:100%}
  .hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
  .hud *{pointer-events:none}
  .hud button,.hud input,.hud .hit{pointer-events:auto}

  /* ---------- top ---------- */
  .top{
    display:flex;align-items:center;gap:28px;
    padding:26px 40px 0;height:64px;flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .dot{width:11px;height:11px;background:var(--accent);display:block}
  .brand .idx{font-size:13px;letter-spacing:.16em;color:var(--ink)}
  .brand .sub{font-size:10px;letter-spacing:.22em;color:var(--faint);text-transform:uppercase}
  .phases{display:flex;align-items:center;gap:6px;margin-left:6px}
  .chip{
    width:30px;height:26px;border:1px solid var(--line);border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--faint);
    position:relative;overflow:hidden;transition:color .25s,border-color .25s;
  }
  .chip .bar{position:absolute;left:0;bottom:0;height:2px;width:0%;background:var(--accent)}
  .chip.on{color:var(--ink);border-color:rgba(232,97,44,.55)}
  .meta{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:11px;color:var(--muted)}
  .meta .sep{width:1px;height:12px;background:var(--line)}
  .meta .dim{color:var(--faint);margin-left:2px}

  /* ---------- 3D-linked labels ---------- */
  .dim-label{
    position:absolute;transform:translate(-50%,-50%);
    font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--ink);
    background:rgba(242,238,230,.86);padding:2px 6px;border-radius:1px;white-space:nowrap;
    opacity:0;will-change:transform,opacity;
  }
  .dim-label .u{color:var(--muted);font-size:10px;margin-left:2px}
  .dim-label.acc{color:var(--accent)}

  .leader-label{
    position:absolute;transform:translate(0,-50%);opacity:0;
    display:flex;align-items:center;gap:8px;
  }
  .leader-label .box{
    background:var(--panel);border:1px solid var(--line);padding:6px 10px;
    display:flex;align-items:baseline;gap:6px;
  }
  .leader-label b{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.02em}
  .leader-label .u{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em}

  .warn-panel{
    position:absolute;opacity:0;transform:translate(-50%,-100%);
    background:var(--panel);border:1px solid var(--line);
    padding:10px 12px;display:flex;align-items:center;gap:10px;
    box-shadow:0 12px 32px rgba(25,23,19,.10);
  }
  .warn-panel .ic{color:var(--accent);display:flex}
  .warn-panel .ic.ok{color:#2C7A4B}
  .warn-panel .num{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em}
  .warn-panel .num.zero{color:#2C7A4B}
  .warn-panel .arrow{color:var(--faint);display:flex}

  /* ---------- inventory ---------- */
  .inv{
    position:absolute;bottom:186px;left:0;right:0;
    display:flex;justify-content:center;gap:10px;padding:0 40px;
  }
  .card{
    width:186px;background:var(--panel);border:1px solid var(--line);
    padding:12px 13px 11px;opacity:0;transform:translateY(18px);
    box-shadow:0 10px 26px rgba(25,23,19,.06);
  }
  .card .row1{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
  .card .row1 .ic{display:flex}
  .card .row1 .pct{font-family:var(--mono);font-size:10px;letter-spacing:.04em}
  .card .n{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.035em;margin-top:6px;line-height:1}
  .card .nm{font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:6px;text-transform:uppercase}
  .card .meter{height:2px;background:rgba(25,23,19,.09);margin-top:9px;position:relative;overflow:hidden}
  .card .meter i{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0%}

  /* ---------- bottom ---------- */
  .bottom{margin-top:auto;padding:0 40px 22px;flex:0 0 auto}
  .transport{display:flex;align-items:center;gap:18px;height:46px}
  .btn{
    width:34px;height:34px;border:1px solid var(--line);background:transparent;color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    transition:background .2s,border-color .2s;
  }
  .btn:hover{background:rgba(25,23,19,.05)}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .segs{display:flex;gap:4px;align-items:center}
  .seg{
    height:22px;min-width:22px;padding:0 6px;border:1px solid transparent;background:transparent;
    color:var(--faint);font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;cursor:pointer;
    transition:color .2s,background .2s;
  }
  .seg:hover{color:var(--ink);background:rgba(25,23,19,.05)}
  .seg.on{color:var(--ink)}
  .seg.on i{background:var(--accent)}
  .seg i{display:block;height:2px;background:rgba(25,23,19,.12);margin-top:5px}
  .slider{position:relative;flex:1;height:34px;display:flex;align-items:center}
  .slider .track{
    position:absolute;left:0;right:0;height:2px;background:rgba(25,23,19,.14);
  }
  .slider .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:var(--accent)}
  .slider .thumb{
    position:absolute;top:50%;width:11px;height:11px;margin-left:-5.5px;
    transform:translateY(-50%) rotate(45deg);background:var(--accent);
  }
  .slider input[type=range]{
    position:absolute;left:-7px;right:-7px;width:calc(100% + 14px);height:34px;margin:0;
    opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent;
  }
  .slider .ticks{position:absolute;left:0;right:0;top:26px;height:12px}
  .slider .ticks span{
    position:absolute;transform:translateX(-50%);
    font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:.02em;
  }
  .now{display:flex;align-items:baseline;gap:3px;min-width:74px;justify-content:flex-end;font-size:11px;color:var(--muted)}
  .now b{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:600}

  .strip{
    display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:14px;
    border-top:1px solid var(--line);
  }
  .cell{
    padding:12px 0 0 0;display:flex;align-items:flex-end;gap:10px;
    opacity:0;transform:translateY(10px);
  }
  .cell + .cell{border-left:1px solid var(--line);padding-left:18px}
  .cell .ic{color:var(--muted);display:flex;align-items:center;height:22px}
  .cell .v{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.04em;line-height:1}
  .cell .u{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.12em;margin-left:5px;text-transform:uppercase}
  .cell.warn .ic{color:var(--accent)}
  .cell.ok .v{color:#2C7A4B}
  .cell.ok .ic{color:#2C7A4B}

  @media (max-width:1100px){
    .card{width:150px}
    .inv{gap:7px}
    .cell .v{font-size:20px}
  }
  @media (max-width:820px){
    .top{padding:16px 18px 0;height:52px;gap:14px}
    .meta .res{display:none}
    .bottom{padding:0 18px 14px}
    .inv{bottom:172px;padding:0 18px;overflow-x:auto;justify-content:flex-start}
    .card{min-width:140px}
    .transport{gap:10px}
    .segs{display:none}
    .cell{padding-top:8px;gap:6px}
    .cell .v{font-size:16px}
    .strip .cell:nth-child(n+5){display:none}
  }
</style>
</head>
<body>
<div id="stage"></div>

<div class="hud">
  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <span class="mono idx">01</span>
    </div>
    <nav class="phases" id="phases"></nav>
    <div class="meta mono">
      <span class="res">1920×1080</span>
      <span class="sep"></span>
      <span id="tc">00:00.00</span>
      <span class="dim">/ 00:32.00</span>
    </div>
  </header>

  <div id="labels" style="position:absolute;inset:0;overflow:hidden"></div>
  <section class="inv" id="inv"></section>

  <footer class="bottom">
    <div class="transport">
      <button class="btn" id="play" aria-label="play"></button>
      <div class="segs" id="segs"></div>
      <div class="slider">
        <div class="track"><div class="fill" id="fill"></div></div>
        <div class="thumb" id="thumb"></div>
        <input type="range" id="range" min="0" max="32" step="0.01" value="0" aria-label="time">
        <div class="ticks" id="ticks"></div>
      </div>
      <div class="now"><b id="now">0.00</b><span>s</span></div>
    </div>
    <div class="strip" id="strip"></div>
  </footer>
</div>

<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
/* =====================================================================
   PALACE CORE — pure data & math. No three.js, no DOM.
   Geunjeongjeon (경복궁 근정전) as a studded brick model.
   Builds the model, audits it, and computes any frame of the 32s
   timeline deterministically from t.
   ===================================================================== */
var PALACE = (function () {
  'use strict';

  var CELL = 0.5;          // world units per cell
  var CM_PER_CELL = 50;    // 1 cell = 50 cm
  var TOTAL = 32;

  var PAL = {
    yard: 0xE9E2D3, yard2: 0xE2DAC8, yard3: 0xEFE9DB, path: 0xD5CCB7, path2: 0xCBC0A9,
    rank: 0xD8D0BC, rank2: 0xC9BFA6, rank3: 0xE1DAC6,
    stone: 0xCFC6B2, stone2: 0xC5BBA5, stone3: 0xB8AD96, stone4: 0xD7CFBC,
    balus: 0xDDD5C2, balus2: 0xD2C9B4,
    col: 0xA63B2B, col2: 0xAF4A31, col3: 0x8E2F22,
    plaster: 0xE6DCC5, plaster2: 0xDCD1B7,
    green: 0x2E6B5A, green2: 0x255748, greenDeep: 0x1A423A,
    hanji: 0xF0E7CE, hanji2: 0xE4D8B9,
    yellow: 0xD9A83C, yellow2: 0xC79327,
    roof: 0x3C3E44, roof2: 0x4C4F57, roof3: 0x34363B,
    eaveRed: 0x9C3527, eaveGreen: 0x2A6154,
    ridge: 0x6E7279, ridge2: 0x5B5F66, ridge3: 0x808389,
    brace: 0xE8612C
  };

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function clamp01(v) { return clamp(v, 0, 1); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ss(a, b, t) { if (b <= a) return t >= b ? 1 : 0; var x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); }
  function bump(a, b, c, d, t) { return ss(a, b, t) * (1 - ss(c, d, t)); }
  function hash(n) { var s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
  function shade(hex, f) {
    var r = clamp(Math.round(((hex >> 16) & 255) * f), 0, 255);
    var g = clamp(Math.round(((hex >> 8) & 255) * f), 0, 255);
    var b = clamp(Math.round((hex & 255) * f), 0, 255);
    return (r << 16) | (g << 8) | b;
  }

  var C = {
    LX0: -42, LX1: 42, LZ0: -34, LZ1: 34,   // 하월대 84 x 68  (42m x 34m)
    UX0: -36, UX1: 36, UZ0: -27, UZ1: 27,   // 상월대 72 x 54  (36m x 27m)
    BX0: -30, BX1: 30, BZ0: -21, BZ1: 21,   // 몸체   60 x 42  (30m x 21m)
    XS: [-30, -20, -8, 8, 20, 30],
    ZS: [-21, -14, -6, 6, 14, 21],
    BASE: 5, COL1: 19,
    G1: 19, G2: 24,        // 하층 처마
    W2: 33, W2T: 37,       // 2층 벽
    G3: 38,                // 상층 처마
    YARD_Z: 38
  };

  /* =====================================================================
     MODEL
     ===================================================================== */
  function buildModel() {
    var t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
    var bricks = [], stages = [], errors = 0, cur = null, seq = 0;

    function stage(part, name) {
      cur = { part: part, name: name, count: 0, i: stages.length };
      stages.push(cur);
      return cur;
    }
    function use(s) { cur = s; }
    function add(part, x, y, z, w, h, d, c) {
      if (!(w >= 1 && h >= 1 && d >= 1)) { errors++; return null; }
      if (!isFinite(x) || !isFinite(y) || !isFinite(z) || !isFinite(w) || !isFinite(h) || !isFinite(d)) { errors++; return null; }
      var b = {
        part: part, x: x | 0, y: y | 0, z: z | 0, w: w | 0, h: h | 0, d: d | 0, c: c,
        dy: 0, stage: cur ? cur.i : 0, i: seq++,
        band: Math.floor((y + (h - 1) / 2) / 4)
      };
      bricks.push(b);
      if (cur) cur.count++;
      return b;
    }
    function jit(c, i, amt) { return shade(c, 1 + (hash(i * 3.77) * 2 - 1) * (amt === undefined ? 0.035 : amt)); }

    function fill(part, x0, x1, z0, z1, y, h, bw, bd, cf) {
      var n = 0, row = 0;
      for (var z = z0; z < z1; z += bd) {
        for (var x = x0; x < x1; x += bw) {
          var w = Math.min(bw, x1 - x), d = Math.min(bd, z1 - z);
          var col = typeof cf === 'function' ? cf(x, z, row, n) : cf;
          add(part, x, y, z, w, h, d, typeof col === 'number' ? jit(col, seq) : col);
          n++;
        }
        row++;
      }
      return n;
    }
    function ring(part, x0, x1, z0, z1, y, h, t, bw, cf) {
      fill(part, x0, x1, z0, z0 + t, y, h, bw, t, cf);
      fill(part, x0, x1, z1 - t, z1, y, h, bw, t, cf);
      fill(part, x0, x0 + t, z0 + t, z1 - t, y, h, t, bw, cf);
      fill(part, x1 - t, x1, z0 + t, z1 - t, y, h, t, bw, cf);
    }
    function roofCourse(part, x0, x1, z0, z1, y, cA, cB) {
      var row = 0;
      for (var z = z0; z < z1; z += 4) {
        var d = Math.min(4, z1 - z);
        var off = (row % 2) ? 4 : 0;
        if (off && (x1 - x0) > off) add(part, x0, y, z, off, 1, d, jit(cA, seq + row));
        for (var x = x0 + off; x < x1; x += 8) {
          var w = Math.min(8, x1 - x);
          add(part, x, y, z, w, 1, d, jit(((row + (x / 8 | 0)) % 2) ? cA : cB, seq));
        }
        row++;
      }
    }

    /* ---------------- 마당 ---------------- */
    stage('yard', '박석');
    fill('yard', -44, 44, C.YARD_Z, 70, 0, 1, 4, 4, function (x, z, r) {
      var v = (r + (x > 0 ? 1 : 0) + (z > 54 ? 1 : 0)) % 3;
      return v === 0 ? PAL.yard : (v === 1 ? PAL.yard2 : PAL.yard3);
    });

    stage('yard', '어도');
    fill('yard', -4, 4, C.YARD_Z, 70, 1, 1, 4, 4, function (x, z, r) { return (r % 2) ? PAL.path : PAL.path2; });

    stage('yard', '품계석');
    for (var rz = 0; rz < 2; rz++) {
      var zRow = rz === 0 ? 46 : 56;
      for (var side = -1; side <= 1; side += 2) {
        for (var k = 0; k < 4; k++) {
          var px = side * (8 + k * 7) - 1;
          add('yard', px, 1, zRow - 1, 3, 2, 2, jit(PAL.rank, seq, 0.03));
          add('yard', px - 1, 3, zRow - 2, 5, 1, 4, PAL.rank2);
          add('yard', px, 4, zRow - 1, 3, 1, 2, PAL.rank3);
        }
      }
    }

    /* ---------------- 월대 ---------------- */
    stage('woldae', '하월대');
    ring('woldae', C.LX0, C.LX1, C.LZ0, C.LZ1, 0, 2, 6, 4, function (x, z, r) {
      return (r % 2) ? PAL.stone : PAL.stone2;
    });
    ring('woldae', C.LX0 + 6, C.LX1 - 6, C.LZ0 + 6, C.LZ1 - 6, 0, 2, 2, 4, function () { return PAL.stone3; });

    stage('woldae', '계단');
    add('woldae', -9, 0, 34, 18, 1, 4, PAL.stone4);
    add('woldae', -9, 1, 34, 18, 1, 2, PAL.stone4);
    add('woldae', -6, 2, 30, 12, 1, 3, PAL.stone);
    add('woldae', -6, 3, 27, 12, 1, 3, PAL.stone);

    stage('woldae', '상월대');
    ring('woldae', C.UX0, C.UX1, C.UZ0, C.UZ1, 2, 2, 6, 4, function (x, z, r) {
      return (r % 2) ? PAL.stone2 : PAL.stone;
    });

    stage('woldae', '돌난간');
    (function () {
      var x, z;
      for (x = C.UX0; x < C.UX1; x += 4) {
        if (x >= -10 && x < 10) continue;
        add('woldae', x, 4, C.UZ1 - 1, 1, 2, 1, PAL.balus);
        if (x + 3 <= C.UX1) add('woldae', x + 1, 5, C.UZ1 - 1, 3, 1, 1, PAL.balus2);
      }
      for (x = C.UX0; x < C.UX1; x += 4) {
        add('woldae', x, 4, C.UZ0, 1, 2, 1, PAL.balus);
        if (x + 3 <= C.UX1) add('woldae', x + 1, 5, C.UZ0, 3, 1, 1, PAL.balus2);
      }
      for (z = C.UZ0 + 4; z < C.UZ1 - 3; z += 4) {
        add('woldae', C.UX0, 4, z, 1, 2, 1, PAL.balus);
        add('woldae', C.UX0, 5, z + 1, 1, 1, 3, PAL.balus2);
        add('woldae', C.UX1 - 1, 4, z, 1, 2, 1, PAL.balus);
        add('woldae', C.UX1 - 1, 5, z + 1, 1, 1, 3, PAL.balus2);
      }
    })();

    /* ---------------- 기둥 · 벽체 · 창호 ---------------- */
    stage('column', '주초');
    for (var gi = 0; gi < 6; gi++) for (var gj = 0; gj < 6; gj++) {
      add('column', C.XS[gi] - 2, 4, C.ZS[gj] - 2, 4, 1, 4, jit(PAL.stone3, seq, 0.03));
    }

    stage('column', '기둥');
    for (gi = 0; gi < 6; gi++) for (gj = 0; gj < 6; gj++) {
      for (var kk = 0; kk < 7; kk++) {
        var cc = kk === 6 ? PAL.green : (kk % 2 ? PAL.col : PAL.col2);
        add('column', C.XS[gi] - 1, C.BASE + kk * 2, C.ZS[gj] - 1, 2, 2, 2, cc);
      }
    }

    stage('column', '벽체');
    var stWall = cur;
    stage('column', '창호');
    var stWin = cur;

    function brickUV(part, S, u0, u1, v0, v1, y, h, c) {
      var a = S.line + S.dir * v0, b = S.line + S.dir * v1;
      if (S.axis === 'x') add(part, u0, y, Math.min(a, b), u1 - u0, h, Math.abs(b - a), c);
      else add(part, Math.min(a, b), y, u0, Math.abs(b - a), h, u1 - u0, c);
    }

    var SIDES = [
      { axis: 'x', line: C.BZ1, dir: -1, u: C.XS },
      { axis: 'x', line: C.BZ0, dir: 1, u: C.XS },
      { axis: 'z', line: C.BX1, dir: -1, u: C.ZS },
      { axis: 'z', line: C.BX0, dir: 1, u: C.ZS }
    ];

    function windowPanel(S, ua, ub, y0, y1) {
      use(stWin);
      // 한지 바탕 : 아래 절반은 어두운 회벽, 위는 한지
      for (var u = ua; u < ub; u += 6) {
        for (var y = y0; y < y1; y += 3) {
          var hh = Math.min(3, y1 - y);
          var rowc = (y - y0 < 3) ? PAL.hanji2 : PAL.hanji;

      const g = stud.clone();
      g.translate((ix + 0.5) * S, H + STUD_H / 2, (iz + 0.5) * S);
      parts.push(g);
    }
  }
  const merged = mergeGeometries(parts, false);
  parts.forEach((p) => p.dispose());
  return merged;
}

function wireGeometry(w, h, d) {
  const W = w * S, H = h * S, D = d * S;
  const t = S * 0.055;
  const boxes = [];
  const add = (px, py, pz, sx, sy, sz) => {
    const g = new THREE.BoxGeometry(sx, sy, sz);
    g.translate(px, py, pz);
    boxes.push(g);
  };
  for (const y of [0, H]) {
    for (const z of [0, D]) add(W / 2, y, z, W, t, t);
    for (const x of [0, W]) add(x, y, D / 2, t, t, D);
  }
  for (const x of [0, W]) for (const z of [0, D]) add(x, H / 2, z, t, H, t);
  const merged = mergeGeometries(boxes, false);
  boxes.forEach((g) => g.dispose());
  return merged;
}

/* ---------------- mountain silhouette (인왕산) ---------------- */
function mountain(zPos, height, color, seed, width) {
  const shape = new THREE.Shape();
  shape.moveTo(-width, -60);
  const steps = 42;
  for (let i = 0; i <= steps; i++) {
    const x = -width + (2 * width * i) / steps;
    const k = i / steps;
    const ridge =
      Math.sin(k * 7.1 + seed) * 0.34 +
      Math.sin(k * 3.3 + seed * 1.7) * 0.5 +
      Math.sin(k * 13.0 + seed * 0.4) * 0.16;
    const envelope = Math.sin(Math.PI * Math.min(1, Math.max(0, k)));
    const y = Math.max(0.4, (0.45 + ridge * 0.55) * height * (0.35 + 0.65 * envelope));
    shape.lineTo(x, y);
  }
  shape.lineTo(width, -60);
  shape.lineTo(-width, -60);
  const geo = new THREE.ShapeGeometry(shape);
  const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 1, depthWrite: false });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(0, 0, zPos);
  m.renderOrder = -5;
  return m;
}

/* ---------------- camera fit ---------------- */
let viewW = 1, viewH = 1;
function fitCamera() {
  const aspect = viewW / viewH;
  const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), CAM_DIR).normalize();
  const up = new THREE.Vector3().crossVectors(CAM_DIR, right).normalize();

  function extent(x0, x1, y0, y1, z0, z1) {
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    for (const x of [x0, x1]) for (const y of [y0, y1]) for (const z of [z0, z1]) {
      const v = new THREE.Vector3(x, y, z).sub(CAM_TARGET);
      const sx = v.dot(right), sy = v.dot(up);
      if (sx < minX) minX = sx; if (sx > maxX) maxX = sx;
      if (sy < minY) minY = sy; if (sy > maxY) maxY = sy;
    }
    return { minX, maxX, minY, maxY };
  }

  const m = MODEL.bbox;
  const full = extent((m.minX - OX) * S, (m.maxX - OX) * S, 0, m.maxY * S, (m.minZ - OZ) * S, (m.maxZ - OZ) * S);
  const pb = MODEL.bodyBox;
  const palace = extent((pb.minX - OX) * S, (pb.maxX - OX) * S, 0, m.maxY * S, (pb.minZ - OZ) * S, (pb.maxZ - OZ) * S);

  const padX = 0.035, padTop = 0.075, padBottom = 0.185;
  let halfW = ((full.maxX - full.minX) / 2) / (1 - padX * 2);
  let halfH = ((full.maxY - full.minY) / 2) / (1 - padTop - padBottom);
  const Z = 1.16;
  halfW /= Z; halfH /= Z;
  if (halfW / halfH < aspect) halfW = halfH * aspect; else halfH = halfW / aspect;

  const cx = (palace.minX + palace.maxX) / 2;
  const cy = (palace.minY + palace.maxY) / 2 + ((padBottom - padTop) / 2) * (2 * halfH);
  const target = CAM_TARGET.clone().addScaledVector(right, cx).addScaledVector(up, cy);

  camera.left = -halfW; camera.right = halfW; camera.top = halfH; camera.bottom = -halfH;
  camera.position.copy(target).addScaledVector(CAM_DIR, 220);
  camera.lookAt(target);
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  CAM_LOOK.copy(target);
  return { right, up };
}

/* projection helper */
const projV = new THREE.Vector3();
function projectPoint(p) {
  projV.copy(p).project(camera);
  return {
    x: (projV.x * 0.5 + 0.5) * viewW,
    y: (-projV.y * 0.5 + 0.5) * viewH,
    visible: projV.z < 1
  };
}

function applyRig(st) {
  const f = st.focus;
  if (f < 0.0005) {
    rig.scale.setScalar(1);
    rig.position.set(0, 0, 0);
  } else {
    const s = 1 + 1.95 * f;
    rig.scale.setScalar(s);
    rig.position.copy(CAM_LOOK).multiplyScalar(f).addScaledVector(FOCUS_P, -s * f);
  }
  rig.updateMatrixWorld(true);
}

function updateBricks(st) {
  const explode = st.explode;
  const mono = st.mono;
  const dimAway = st.dimAway;
  const sweepA = st.sweepA;
  const sweepY = st.sweep * bbox.y1;
  const wireV = st.wire;
  const minY = 0, maxY = bbox.y1;

  const bgr = BG_LIN.r, bgg = BG_LIN.g, bgb = BG_LIN.b;

  for (let mi = 0; mi < meshes.length; mi++) {
    const M = meshes[mi];
    const items = M.bucket.items;
    const mArr = M.mArr, cArr = M.cArr, wArr = M.wArr;
    const isRoof = M.bucket.part === 'roof';
    for (let i = 0; i < M.n; i++) {
      const b = items[i];
      const o16 = i * 16;
      if (b.isBrace) {
        // 보강 브릭 : 19.1~20.7s 사이에 하나씩 놓인다
        const n = MODEL.braces.length;
        const per = 0.55;
        const start = 0.06 + (b.braceIdx / Math.max(1, n - 1)) * per;
        const a = PALACE.ss(start, start + 0.30, st.fix);
        const sc = Math.max(0.0001, a);
        mArr[o16] = sc; mArr[o16 + 5] = sc; mArr[o16 + 10] = sc; mArr[o16 + 15] = 1;
        mArr[o16 + 12] = b.wx;
        mArr[o16 + 13] = b.wy + (1 - a) * 0.7 + explode * b.band * 0.62;
        mArr[o16 + 14] = b.wz;
        cArr[i * 3] = PALACE_ACCENT.r; cArr[i * 3 + 1] = PALACE_ACCENT.g; cArr[i * 3 + 2] = PALACE_ACCENT.b;
        if (wireV > 0.001) { wArr[i * 3] = PALACE_ACCENT.r; wArr[i * 3 + 1] = PALACE_ACCENT.g; wArr[i * 3 + 2] = PALACE_ACCENT.b; }
        continue;
      }
      const lift = explode * b.band * 0.62;
      if (lift !== 0) mArr[o16 + 13] = b.wy + lift;
      else mArr[o16 + 13] = b.wy;

      let r = b.lr, g = b.lg, bl = b.lb;
      if (mono > 0.001) {
        const l = b.lum;
        const m = mono * 0.95;
        r += (l - r) * m; g += (l - g) * m; bl += (l - bl) * m;
      }
      if (dimAway > 0.001 && !isRoof) {
        const m = dimAway * 0.76;
        r += (bgr - r) * m; g += (bgg - g) * m; bl += (bgb - bl) * m;
      }
      if (sweepA > 0.001) {
        const d = Math.abs(b.yc - sweepY);
        if (d < 3.4) {
          const k = Math.pow(1 - d / 3.4, 1.6) * sweepA;
          const tt = PALACE.clamp01((b.yc - minY) / (maxY - minY));
          const ar = ACCENT_LIN.r + (BLUE_LIN.r - ACCENT_LIN.r) * tt;
          const ag = ACCENT_LIN.g + (BLUE_LIN.g - ACCENT_LIN.g) * tt;
          const ab = ACCENT_LIN.b + (BLUE_LIN.b - ACCENT_LIN.b) * tt;
          r += (ar - r) * k; g += (ag - g) * k; bl += (ab - bl) * k;
          if (wireV > 0.01) {
            wArr[i * 3] += (ar - wArr[i * 3]) * k;
            wArr[i * 3 + 1] += (ag - wArr[i * 3 + 1]) * k;
            wArr[i * 3 + 2] += (ab - wArr[i * 3 + 2]) * k;
          }
        }
      }
      if (b.weakCol !== undefined && st.warn > 0.001) {
        const pulse = 0.65 + 0.35 * Math.sin(st.t * 7.0);
        const k = st.warn * pulse;
        r += (PALACE_ACCENT.r - r) * k;
        g += (PALACE_ACCENT.g - g) * k;
        bl += (PALACE_ACCENT.b - bl) * k;
      }
      cArr[i * 3] = r; cArr[i * 3 + 1] = g; cArr[i * 3 + 2] = bl;

      if (wireV > 0.001) {
        const wr = b.lr * 0.42, wg = b.lg * 0.42, wb = b.lb * 0.46;
        if (sweepA <= 0.001) {
          wArr[i * 3] = wr; wArr[i * 3 + 1] = wg; wArr[i * 3 + 2] = wb;
        } else {
          const d = Math.abs(b.yc - sweepY);
          const k = d < 3.4 ? Math.pow(1 - d / 3.4, 1.6) * sweepA : 0;
          const tt = PALACE.clamp01((b.yc - minY) / (maxY - minY));
          const ar = ACCENT_LIN.r + (BLUE_LIN.r - ACCENT_LIN.r) * tt;
          const ag = ACCENT_LIN.g + (BLUE_LIN.g - ACCENT_LIN.g) * tt;
          const ab = ACCENT_LIN.b + (BLUE_LIN.b - ACCENT_LIN.b) * tt;
          wArr[i * 3] = wr + (ar - wr) * k;
          wArr[i * 3 + 1] = wg + (ag - wg) * k;
          wArr[i * 3 + 2] = wb + (ab - wb) * k;
        }
      }
    }
    M.mesh.instanceMatrix.needsUpdate = true;
    M.mesh.instanceColor.needsUpdate = true;
    if (wireV > 0.001) M.wire.instanceColor.needsUpdate = true;
  }

  solidMat.opacity = 1 - wireV * 0.94;
  solidMat.depthWrite = wireV < 0.5;
  wireMat.opacity = wireV * 0.9;
  for (const M of meshes) M.wire.visible = wireV > 0.002;
  if (wireV > 0.002 && lastWire <= 0.002) {
    // matrices already shared; just make sure they are flagged
    for (const M of meshes) M.mesh.instanceMatrix.needsUpdate = true;
  }
  lastWire = wireV;
}

function updateOverlays(st) {
  // bounding box draw
  const segs = bbCorners.length * SEGS_PER_EDGE;
  const drawn = Math.max(0, Math.min(segs, Math.floor(st.bboxDraw * segs)));
  bboxGeo.setDrawRange(0, drawn * 2);
  bboxMat.opacity = st.bboxA * 0.92;

  // dimension lines
  [dimW, dimD, dimH].forEach((d, i) => {
    const p = PALACE.clamp01((st.dims - i * 0.12) / 0.7);
    d.geo.setDrawRange(0, Math.max(0, Math.floor(p * 10)) * 2);
    d.mat.opacity = st.dimsA * (p > 0 ? 0.85 : 0);
  });

  // leader
  const lp = PALACE.clamp01(st.leader);
  leaderGeo.setDrawRange(0, Math.max(0, Math.floor(lp * (12 + 6))) * 2);
  leaderMat.opacity = st.leader * 0.9;

  // mountain
  mtnBack.material.opacity = 1;
  mtnFront.material.opacity = 1;
}

function updateHUD(st) {
  const t = st.t;
  document.getElementById('tc').textContent =
    String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(Math.floor(t % 60)).padStart(2, '0') + '.' + String(Math.floor((t % 1) * 100)).padStart(2, '0');
  const p = t / TOTAL;
  const fill = document.getElementById('fill');
  const thumb = document.getElementById('thumb');
  fill.style.width = (p * 100) + '%';
  thumb.style.left = (p * 100) + '%';
  if (document.activeElement !== rangeEl) rangeEl.value = t;

  const ph = PALACE.phaseAt(t);
  chips.forEach((c, i) => {
    const on = i === ph;
    c.classList.toggle('on', on);
    const start = PH[i], end = PH[i + 1];
    const prog = PALACE.clamp01((t - start) / (end - start));
    c.querySelector('.bar').style.width = (on ? prog * 100 : (i < ph ? 100 : 0)) + '%';
  });
  segBtns.forEach((b, i) => b.classList.toggle('on', i === ph));

  // dimensions
  const dv = { w: MODEL.dims.w, d: MODEL.dims.d, h: MODEL.dims.h };
  ['w', 'd', 'h'].forEach((k) => {
    const el = dimLabels[k];
    const anchor = dimAnchors[k];
    const pr = projectPoint(anchor);
    el.style.transform = 'translate(-50%,-50%) translate(' + pr.x.toFixed(1) + 'px,' + (pr.y - 16).toFixed(1) + 'px)';
    el.style.opacity = (st.dimsA * Math.min(1, Math.max(0, st.dims * 1.4 - 0.2))).toFixed(3);
    el.querySelector('[data-v]').textContent = fmt(dv[k] * PALACE.clamp01(st.dims * 1.1 - 0.05));
  });

  // leader label
  const lp = projectPoint(leaderTo);
  leaderLabel.style.transform = 'translate(6px,-50%) translate(' + lp.x.toFixed(1) + 'px,' + lp.y.toFixed(1) + 'px)';
  leaderLabel.style.opacity = st.leader.toFixed(3);
  leaderLabel.querySelector('[data-v]').textContent = fmt(MODEL.partCount.roof * PALACE.clamp01(st.leaderCount * 1.05));

  // warning panel
  const wPr = projectPoint(FOCUS_P.clone().applyMatrix4(rig.matrixWorld).applyMatrix4(new THREE.Matrix4()));
  const wNow = projectPoint(new THREE.Vector3().copy(FOCUS_P).applyMatrix4(rig.matrixWorld));
  warnPanel.style.transform = 'translate(-50%,-100%) translate(' + (wNow.x - 86).toFixed(1) + 'px,' + (wNow.y - 54).toFixed(1) + 'px)';
  const wA = Math.max(st.warn, st.done);
  warnPanel.style.opacity = wA.toFixed(3);
  const remaining = Math.max(0, Math.round(MODEL.warningsBefore * (1 - st.fix)));
  warnPanel.querySelector('[data-n]').textContent = String(remaining);
  const ic = warnPanel.querySelector('[data-ic]');
  ic.innerHTML = remaining > 0 ? ICON.warn : ICON.check;
  ic.style.color = remaining > 0 ? '' : '#2C7A4B';
  warnPanel.querySelector('[data-ok]').style.opacity = remaining === 0 ? '1' : '0';
  warnPanel.querySelector('[data-z]').style.opacity = remaining === 0 ? '1' : '0.25';

  // inventory
  const totalBricks = MODEL.bricks.length;
  cards.forEach((c, i) => {
    const a = st.inv[i];
    c.el.style.opacity = a.toFixed(3);
    c.el.style.transform = 'translateY(' + ((1 - a) * 18).toFixed(1) + 'px)';
    const v = c.count * (st.invCnt ? st.invCnt[i] : a);
    c.n.textContent = fmt(v);
    const pct = (c.count / totalBricks) * 100;
    c.pct.textContent = pct.toFixed(1) + '%';
    c.meter.style.width = (pct * (st.invCnt ? st.invCnt[i] : a)).toFixed(1) + '%';
  });

  // stat strip
  cells.forEach((c, i) => {
    const a = st.stats[i];
    c.el.style.opacity = a.toFixed(3);
    c.el.style.transform = 'translateY(' + ((1 - a) * 10).toFixed(1) + 'px)';
    c.v.textContent = fmt(c.def.value * (st.statsCnt ? st.statsCnt[i] : a));
  });
}

function drawFrame(t) {
  currentT = t;
  const st = PALACE.frameState(t);
  applyRig(st);
  updateBricks(st);
  updateOverlays(st);
  updateHUD(st);
  renderer.render(scene, camera);
}

/* ---------------- playback ---------------- */
let playing = true;
let clockLast = performance.now();
const playBtn = document.getElementById('play');
const rangeEl = document.getElementById('range');

function setPlaying(v) {
  playing = v;
  playBtn.classList.toggle('on', v);
  playBtn.innerHTML = v ? ICON.pause : ICON.play;
  clockLast = performance.now();
}
function setTime(t) {
  const tt = PALACE.clamp(Number(t) || 0, 0, TOTAL);
  drawFrame(tt);
  clockLast = performance.now();
  return tt;
}
function seek(t) { return setTime(t); }
playBtn.addEventListener('click', () => setPlaying(!playing));
rangeEl.addEventListener('input', () => {
  setPlaying(false);
  seek(parseFloat(rangeEl.value));
});
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'ArrowRight') { e.preventDefault(); setPlaying(false); seek(currentT + (e.shiftKey ? 1 : 0.2)); }
  else if (e.code === 'ArrowLeft') { e.preventDefault(); setPlaying(false); seek(currentT - (e.shiftKey ? 1 : 0.2)); }
  else if (e.code === 'Home') { setPlaying(false); seek(0); }
  else if (/^Digit[1-6]$/.test(e.code)) { const i = parseInt(e.code.slice(5), 10) - 1; setPlaying(false); seek(PH[i] + 0.02); }
});

/* ---------------- resize ---------------- */
function resize() {
  viewW = stageEl.clientWidth || window.innerWidth;
  viewH = stageEl.clientHeight || window.innerHeight;
  renderer.setSize(viewW, viewH, false);
  fitCamera();
  drawFrame(currentT);
}
window.addEventListener('resize', resize);

/* ---------------- loop ---------------- */
function loop(now) {
  const dt = Math.min(0.05, (now - clockLast) / 1000);
  clockLast = now;
  if (playing) {
    currentT += dt;
    if (currentT >= TOTAL) currentT -= TOTAL;
    drawFrame(currentT);
  }
  requestAnimationFrame(loop);
}

/* ---------------- boot ---------------- */
resize();
setPlaying(true);
drawFrame(0);
requestAnimationFrame(loop);
window.setTime = setTime;
window.PALACE_APP = { drawFrame, setTime, seek, model: MODEL, setPlaying, get t() { return currentT; } };
window.BUILD_ID = '1795042706';
window.PALACE_DEBUG = { solidMat, wireMat, meshes, buckets, scene, camera, rig, renderer };
</script>
